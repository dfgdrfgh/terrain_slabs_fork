name: Build Minecraft 1.21.1

on:
  push:
    branches: ["1.21.1"]
  pull_request:
    branches: ["1.21.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Test iceberg slab compatibility and build Fabric and NeoForge
        run: bash ./gradlew :common:test :fabric:build :neoforge:build --no-daemon
      - name: Verify original iceberg generator is not modified
        run: |
          python3 - <<'PY'
          import json, pathlib, zipfile
          jars = [p for platform in ('fabric', 'neoforge')
                  for p in pathlib.Path(platform, 'build', 'libs').glob('*.jar')
                  if not p.name.endswith('-sources.jar') and '-dev' not in p.name]
          assert len(jars) == 2, f'Expected two playable jars, got {jars}'
          for path in jars:
              with zipfile.ZipFile(path) as jar:
                  config = json.loads(jar.read('terrain_slabs.mixins.json'))
                  assert 'feature.MixinIcebergFeature' not in config['mixins'], 'Iceberg carving/placement hook must not ship'
                  assert not any(name.endswith('/MixinIcebergFeature.class') for name in jar.namelist()), 'Obsolete iceberg hook class must not ship'
                  print(f'{path.name}: original iceberg placement and carving rules retained')
          PY
      - name: Verify Fabric and NeoForge mixins load
        run: |
          python - <<'PY'
          import os, pathlib, re, signal, subprocess, time
          for directory in ('run', 'fabric/run', 'neoforge/run'):
              path = pathlib.Path(directory)
              path.mkdir(parents=True, exist_ok=True)
              (path / 'eula.txt').write_text('eula=false\n')
          def ready(text):
              return 'You need to agree to the EULA' in text or re.search(r'Done \([^\n]*\)! For help, type', text) is not None
          for loader in ('fabric', 'neoforge'):
              log = pathlib.Path(f'{loader}-startup.log')
              with log.open('w') as output:
                  process = subprocess.Popen(['bash', './gradlew', f':{loader}:runServer', '--no-daemon'],
                                             stdout=output, stderr=subprocess.STDOUT,
                                             stdin=subprocess.DEVNULL, start_new_session=True)
                  try:
                      deadline = time.monotonic() + 240
                      while process.poll() is None and time.monotonic() < deadline:
                          if ready(log.read_text()):
                              break
                          time.sleep(1)
                  finally:
                      if process.poll() is None:
                          os.killpg(process.pid, signal.SIGTERM)
                          try:
                              process.wait(timeout=10)
                          except subprocess.TimeoutExpired:
                              os.killpg(process.pid, signal.SIGKILL)
                              process.wait()
              text = log.read_text()
              print(text, flush=True)
              assert ready(text), f'{loader} did not reach normal server bootstrap'
              assert 'Registering Mod Blocks & Items for terrain_slabs' in text, f'{loader} did not initialize Terrain Slabs'
              for error in ('Mixin apply failed', 'InvalidInjectionException', 'InjectionError', 'MixinTransformerError'):
                  assert error not in text, f'{loader}: {error}'
              print(f'{loader}: mixins and registries loaded; startup checkpoint reached', flush=True)
          PY
      - name: Verify generated frozen-ocean worlds
        run: python3 tools/verify_iceberg_worldgen.py
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-regression-logs
          path: |
            *-startup.log
            *-iceberg-worldgen.log
            common/build/test-results/test/*.xml
          if-no-files-found: warn
      - name: Collect playable jars
        run: |
          mkdir -p artifacts
          find fabric/build/libs neoforge/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev*.jar' -exec cp {} artifacts/ \;
          test "$(find artifacts -name '*.jar' | wc -l)" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-slabs-1.21.1
          path: artifacts/*.jar
          if-no-files-found: error
