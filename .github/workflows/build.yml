name: Build Minecraft 1.21.1

on:
  push:
    branches: ["1.21.1"]
  pull_request:
    branches: ["1.21.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Inspect vanilla iceberg generation
        run: |
          bash ./gradlew :common:genSources --no-daemon
          python - <<'PY'
          import os, zipfile
          for root, _, files in os.walk(os.environ['GRADLE_USER_HOME']):
              for name in files:
                  if not name.endswith('-sources.jar') or 'minecraft' not in name:
                      continue
                  with zipfile.ZipFile(os.path.join(root, name)) as archive:
                      for path in archive.namelist():
                          if path.endswith('/IcebergFeature.java') or path.endswith('/MappedRegistry.java'):
                              print(archive.read(path).decode())
          PY
      - name: Test iceberg cleanup and build Fabric and NeoForge
        run: bash ./gradlew :common:test :fabric:build :neoforge:build --no-daemon
      - name: Collect playable jars
        run: |
          mkdir -p artifacts
          find fabric/build/libs neoforge/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev*.jar' -exec cp {} artifacts/ \;
          test "$(find artifacts -name '*.jar' | wc -l)" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-slabs-1.21.1
          path: artifacts/*.jar
          if-no-files-found: error
