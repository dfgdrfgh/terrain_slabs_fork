name: Build Minecraft 1.21.1

on:
  push:
    branches: ["1.21.1"]
  pull_request:
    branches: ["1.21.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Test iceberg slab compatibility and build Fabric and NeoForge
        run: bash ./gradlew :common:test :fabric:build :neoforge:build --no-daemon
      - name: Verify Fabric and NeoForge mixins load
        run: |
          python - <<'PY'
          import pathlib, subprocess
          for directory in ('run', 'fabric/run', 'neoforge/run'):
              path = pathlib.Path(directory)
              path.mkdir(parents=True, exist_ok=True)
              (path / 'eula.txt').write_text('eula=false\n')
          for loader in ('fabric', 'neoforge'):
              result = subprocess.run(['bash', './gradlew', f':{loader}:runServer', '--no-daemon'],
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      text=True, timeout=180)
              print(result.stdout)
              pathlib.Path(f'{loader}-startup.log').write_text(result.stdout)
              assert 'You need to agree to the EULA' in result.stdout, f'{loader} did not reach normal server bootstrap'
              for error in ('Mixin apply failed', 'InvalidInjectionException', 'InjectionError', 'MixinTransformerError'):
                  assert error not in result.stdout, f'{loader}: {error}'
              print(f'{loader}: mixins and registries loaded; stopped before creating a world')
          PY
      - name: Collect playable jars
        run: |
          mkdir -p artifacts
          find fabric/build/libs neoforge/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev*.jar' -exec cp {} artifacts/ \;
          test "$(find artifacts -name '*.jar' | wc -l)" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-slabs-1.21.1
          path: artifacts/*.jar
          if-no-files-found: error
