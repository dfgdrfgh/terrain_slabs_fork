name: Build Minecraft 1.21.1

on:
  push:
    branches: ["1.21.1"]
  pull_request:
    branches: ["1.21.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Clean build Fabric and NeoForge
        run: bash ./gradlew clean :fabric:build :neoforge:build --no-build-cache --no-daemon
      - name: Check worldgen preserves authored landscaping
        run: bash ./gradlew :fabric:runGameTest --no-daemon
      - name: Collect separate playable jars and checksums
        shell: bash
        run: |
          for platform in fabric neoforge; do
            mkdir -p "artifacts/$platform"
            mapfile -t jars < <(find "$platform/build/libs" -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev*.jar')
            test "${#jars[@]}" -eq 1
            cp "${jars[0]}" "artifacts/$platform/"
            (cd "artifacts/$platform" && sha256sum *.jar > SHA256SUMS.txt)
          done
      - name: Upload Fabric download
        uses: actions/upload-artifact@v4
        with:
          name: terrain-slabs-fabric-1.21.1
          path: artifacts/fabric/*
          if-no-files-found: error
      - name: Upload NeoForge download
        uses: actions/upload-artifact@v4
        with:
          name: terrain-slabs-neoforge-1.21.1
          path: artifacts/neoforge/*
          if-no-files-found: error
