name: Build Minecraft 1.21.1

on:
  push:
    branches: ["1.21.1"]
  pull_request:
    branches: ["1.21.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build Fabric and NeoForge
        run: bash ./gradlew :fabric:build :neoforge:build --no-daemon
      - name: Collect playable jars
        run: |
          mkdir -p artifacts
          find fabric/build/libs neoforge/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev*.jar' -exec cp {} artifacts/ \;
          test "$(find artifacts -name '*.jar' | wc -l)" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-slabs-1.21.1
          path: artifacts/*.jar
          if-no-files-found: error
